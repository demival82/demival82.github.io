<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Геометрический медиан (N точек)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 30px 35px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
            max-width: 860px;
            width: 100%;
            margin: 20px;
        }
        h1 {
            font-weight: 600;
            font-size: 24px;
            color: #0b1a2e;
            margin: 0 0 6px 0;
        }
        .sub {
            color: #4a5b6e;
            font-size: 15px;
            margin: 0 0 20px 0;
            border-left: 4px solid #3b82f6;
            padding-left: 14px;
            background: #f8fafc;
            border-radius: 0 10px 10px 0;
            line-height: 1.5;
        }
        .canvas-wrapper {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 0 0 2px #dce3ec, 0 4px 12px rgba(0,0,0,0.06);
            padding: 6px;
            margin-bottom: 20px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            background: white;
            border-radius: 14px;
            cursor: crosshair;
            touch-action: none;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
            align-items: center;
            margin-bottom: 18px;
        }
        .btn {
            background: #1a293b;
            border: none;
            color: white;
            font-weight: 500;
            font-size: 15px;
            padding: 10px 26px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .btn:hover { background: #0f1e30; transform: scale(0.97); }
        .btn-secondary {
            background: #e8edf4;
            color: #1a293b;
        }
        .btn-secondary:hover { background: #d5dee9; }
        .select-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f7fafc;
            padding: 5px 14px 5px 18px;
            border-radius: 60px;
            border: 1px solid #e2e8f0;
        }
        .select-group label {
            font-weight: 500;
            color: #2c3e50;
            font-size: 14px;
        }
        .select-group select {
            background: white;
            border: 1px solid #cdd7e3;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 500;
            color: #0b1a2e;
            outline: none;
            cursor: pointer;
        }
        .stats {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 4px 18px;
            background: #f7fafc;
            border-radius: 16px;
            padding: 16px 22px;
            font-size: 14px;
            border: 1px solid #e9edf2;
            align-items: center;
        }
        .stats .label { color: #4a5b6e; font-weight: 450; }
        .stats .value { font-weight: 600; color: #0b1a2e; font-variant-numeric: tabular-nums; }
        .stats .highlight { color: #2563eb; }
        .stats .med-label {
            background: #2563eb10;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 13px;
            color: #1a4b9e;
            font-weight: 500;
        }
        .point-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            margin-top: 6px;
            font-size: 13px;
            color: #2c3e50;
        }
        .point-list span {
            background: #f1f5f9;
            padding: 2px 12px 2px 10px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .dot-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(0,0,0,0.15);
        }
        .dot-indicator.median-dot { background: #2563eb; border-color: #1d4ed8; }
        .dot-indicator.point-dot { background: #dc2626; border-color: #b91c1c; }
        .footer-note {
            font-size: 13px;
            color: #6b7d90;
            margin-top: 14px;
            text-align: center;
            border-top: 1px solid #eef2f6;
            padding-top: 14px;
        }
        @media (max-width: 550px) {
            .card { padding: 18px 16px 28px; }
            .stats { grid-template-columns: 1fr; gap: 6px; padding: 14px 16px; }
            .controls { flex-direction: column; align-items: stretch; }
            .btn { justify-content: center; }
            .select-group { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📍 Геометрический медиан</h1>
    <div class="sub">
        Точка, сумма расстояний до которой от всех заданных точек — минимальна.
        <span style="display:inline-block; margin-left:10px; font-weight:400;">(алгоритм Вайсфельда)</span>
    </div>

    <div class="canvas-wrapper">
        <canvas id="canvas" width="700" height="700"></canvas>
    </div>

    <div class="controls">
        <button class="btn" id="btnRandom">🎲 Случайные точки</button>
        <button class="btn btn-secondary" id="btnReset">⟲ Сброс</button>
        <div class="select-group">
            <label for="pointCount">Точек:</label>
            <select id="pointCount">
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
        <span style="font-size:14px; color:#4a5b6e; margin-left:auto;">
            ⚡ <span id="iterCount">0</span> итераций
        </span>
    </div>

    <div class="stats">
        <span class="label">📐 Сумма расстояний</span>
        <span class="value highlight" id="totalDist">—</span>
        <span class="med-label">медиан</span>

        <span class="label" style="grid-column:1;">📍 Медиан</span>
        <span class="value" id="medianCoords" style="grid-column:2/3;">(—, —)</span>
        <span style="grid-column:3; font-size:13px; color:#4a5b6e;">
            <span class="dot-indicator median-dot" style="vertical-align:middle;"></span>
        </span>
    </div>

    <div class="point-list" id="pointList"></div>

    <div class="footer-note">
        🖱️ Кликните по холсту, чтобы добавить / переместить точку (перетащите)
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const totalDistEl = document.getElementById('totalDist');
        const medianCoordsEl = document.getElementById('medianCoords');
        const pointListEl = document.getElementById('pointList');
        const iterCountEl = document.getElementById('iterCount');
        const pointCountSelect = document.getElementById('pointCount');

        let N = 5; // текущее количество точек
        let points = [];
        let median = { x: 350, y: 350 };
        let iterationCount = 0;
        let isDragging = false;
        let dragIndex = -1;

        // ---------- генерация случайных точек ----------
        function generateRandomPoints(count) {
            const pts = [];
            for (let i = 0; i < count; i++) {
                pts.push({
                    x: 60 + Math.random() * 580,
                    y: 60 + Math.random() * 580,
                });
            }
            return pts;
        }

        // ---------- алгоритм Вайсфельда ----------
        function computeMedian() {
            if (points.length === 0) return;
            let cx = 0, cy = 0;
            for (const p of points) { cx += p.x; cy += p.y; }
            cx /= points.length;
            cy /= points.length;

            const eps = 1e-7;
            const maxIter = 5000;
            let iter = 0;
            for (iter = 0; iter < maxIter; iter++) {
                let numX = 0, numY = 0, denom = 0;
                let converged = true;
                for (const p of points) {
                    const dx = p.x - cx;
                    const dy = p.y - cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 1e-12) {
                        converged = false;
                        break;
                    }
                    const w = 1 / dist;
                    numX += p.x * w;
                    numY += p.y * w;
                    denom += w;
                }
                if (!converged || denom < 1e-30) break;
                const newX = numX / denom;
                const newY = numY / denom;
                const move = Math.hypot(newX - cx, newY - cy);
                cx = newX; cy = newY;
                if (move < eps) break;
            }
            median = { x: cx, y: cy };
            iterationCount = iter + 1;
            // если медиан совпал с точкой — фиксируем
            for (const p of points) {
                if (Math.hypot(p.x - median.x, p.y - median.y) < 0.5) {
                    median = { x: p.x, y: p.y };
                    break;
                }
            }
        }

        function totalDistance() {
            let sum = 0;
            for (const p of points) {
                sum += Math.hypot(p.x - median.x, p.y - median.y);
            }
            return sum;
        }

        // ---------- отрисовка ----------
        function render() {
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);
            // сетка
            ctx.save();
            ctx.strokeStyle = '#eef2f6';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const pos = (i / 10) * w;
                ctx.beginPath();
                ctx.moveTo(pos, 0);
                ctx.lineTo(pos, h);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, pos);
                ctx.lineTo(w, pos);
                ctx.stroke();
            }
            ctx.restore();

            // линии от медианы к точкам
            ctx.save();
            ctx.strokeStyle = '#2563eb30';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 8]);
            for (const p of points) {
                ctx.beginPath();
                ctx.moveTo(median.x, median.y);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }
            ctx.restore();

            // точки
            for (const p of points) {
                ctx.save();
                ctx.shadowColor = 'rgba(220,38,38,0.4)';
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 14, 0, 2 * Math.PI);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 11, 0, 2 * Math.PI);
                ctx.fillStyle = '#dc2626';
                ctx.fill();
                ctx.strokeStyle = '#b91c1c';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(p.x - 3, p.y - 4, 3, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fill();
                ctx.restore();
                ctx.save();
                ctx.fillStyle = '#1a293b';
                ctx.font = 'bold 13px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`P${points.indexOf(p) + 1}`, p.x, p.y - 18);
                ctx.restore();
            }

            // медиан
            ctx.save();
            ctx.shadowColor = 'rgba(37,99,235,0.4)';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(median.x, median.y, 18, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(median.x, median.y, 14, 0, 2 * Math.PI);
            ctx.fillStyle = '#2563eb';
            ctx.fill();
            ctx.strokeStyle = '#1d4ed8';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(median.x - 4, median.y - 5, 4, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.fillStyle = '#1e40af';
            ctx.font = 'bold 14px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText('★ медиан', median.x + 22, median.y - 6);
            ctx.restore();

            // статистика
            const dist = totalDistance();
            totalDistEl.textContent = dist.toFixed(4);
            medianCoordsEl.textContent = `(${median.x.toFixed(1)}, ${median.y.toFixed(1)})`;
            iterCountEl.textContent = iterationCount;

            // список точек
            let html = '';
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                html += `<span>
                            <span class="dot-indicator point-dot"></span>
                            P${i+1} (${p.x.toFixed(1)}, ${p.y.toFixed(1)})
                        </span>`;
            }
            pointListEl.innerHTML = html;
        }

        // ---------- обновление количества точек ----------
        function setPointCount(newCount) {
            N = newCount;
            // генерируем новые случайные точки
            points = generateRandomPoints(N);
            computeMedian();
            render();
        }

        // ---------- обработчики ввода ----------
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
            };
        }

        function onPointerDown(e) {
            e.preventDefault();
            const pos = getMousePos(e);
            let minDist = 30;
            let found = -1;
            for (let i = 0; i < points.length; i++) {
                const d = Math.hypot(points[i].x - pos.x, points[i].y - pos.y);
                if (d < minDist) {
                    minDist = d;
                    found = i;
                }
            }
            if (found !== -1) {
                isDragging = true;
                dragIndex = found;
            } else {
                // заменить самую дальнюю точку
                let maxDist = -1;
                let replaceIdx = 0;
                for (let i = 0; i < points.length; i++) {
                    const d = Math.hypot(points[i].x - pos.x, points[i].y - pos.y);
                    if (d > maxDist) {
                        maxDist = d;
                        replaceIdx = i;
                    }
                }
                points[replaceIdx] = { x: pos.x, y: pos.y };
                computeMedian();
                render();
            }
        }

        function onPointerMove(e) {
            e.preventDefault();
            if (!isDragging || dragIndex === -1) return;
            const pos = getMousePos(e);
            const margin = 10;
            pos.x = Math.max(margin, Math.min(canvas.width - margin, pos.x));
            pos.y = Math.max(margin, Math.min(canvas.height - margin, pos.y));
            points[dragIndex].x = pos.x;
            points[dragIndex].y = pos.y;
            computeMedian();
            render();
        }

        function onPointerUp(e) {
            e.preventDefault();
            isDragging = false;
            dragIndex = -1;
        }

        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', (e) => { if (isDragging) onPointerMove(e); });
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp, { passive: false });
        canvas.addEventListener('touchcancel', onPointerUp, { passive: false });

        // ---------- кнопки ----------
        document.getElementById('btnRandom').addEventListener('click', () => {
            points = generateRandomPoints(N);
            computeMedian();
            render();
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            // задаём фиксированный набор для текущего N (имитация сброса)
            points = generateRandomPoints(N);
            computeMedian();
            render();
        });

        pointCountSelect.addEventListener('change', (e) => {
            const newCount = parseInt(e.target.value);
            if (newCount !== N) {
                setPointCount(newCount);
            }
        });

        // ---------- запуск ----------
        // инициализация: берём N из select
        N = parseInt(pointCountSelect.value);
        points = generateRandomPoints(N);
        computeMedian();
        render();
    })();
</script>
</body>
</html>
