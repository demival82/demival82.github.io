<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Спираль из 2000 частиц</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
        }

        /* ── Информационный оверлей ── */
        .info {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 24px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
            transition: opacity 0.8s;
        }

        .info span {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        /* ── Счётчик в углу ── */
        .counter {
            position: fixed;
            top: 28px;
            right: 32px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 1px;
            pointer-events: none;
            font-variant-numeric: tabular-nums;
        }

        .counter strong {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 500;
        }

        /* ── Адаптив ── */
        @media (max-width: 640px) {
            .info {
                font-size: 11px;
                padding: 8px 18px;
                bottom: 20px;
                letter-spacing: 2px;
            }
            .counter {
                font-size: 11px;
                top: 18px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="counter">
        <strong id="countDisplay">2000</strong> частиц
    </div>

    <div class="info">
        ✦ перетащите для вращения &nbsp;·&nbsp; <span>scroll</span> для масштаба ✦
    </div>

    <!-- ── Three.js ── -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ────────────────────────────
        // 1. СЦЕНА, КАМЕРА, РЕНДЕР
        // ────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a14);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(14, 8, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // ────────────────────────────
        // 2. УПРАВЛЕНИЕ
        // ────────────────────────────
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.8;
        controls.minDistance = 5;
        controls.maxDistance = 45;
        controls.target.set(0, 0, 0);
        controls.update();

        // ────────────────────────────
        // 3. ПОСТ-ОБРАБОТКА (Bloom)
        // ────────────────────────────
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.4, // сила свечения
            0.3, // радиус
            0.1 // порог
        );
        composer.addPass(bloomPass);

        // ────────────────────────────
        // 4. ТЕКСТУРА ДЛЯ ЧАСТИЦ
        // ────────────────────────────
        function createGlowTexture() {
            const size = 64;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const center = size / 2;
            const gradient = ctx.createRadialGradient(center, center, 0, center, center, center);
            gradient.addColorStop(0.0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.15, 'rgba(255, 255, 255, 0.95)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.6)');
            gradient.addColorStop(0.8, 'rgba(255, 255, 255, 0.2)');
            gradient.addColorStop(1.0, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const particleTexture = createGlowTexture();

        // ────────────────────────────
        // 5. СОЗДАНИЕ СПИРАЛИ (2000 частиц)
        // ────────────────────────────
        const COUNT = 2000;
        const REVOLUTIONS = 14;
        const RADIUS_MAX = 7.5;
        const HEIGHT_MAX = 9;

        const positions = new Float32Array(COUNT * 3);
        const colors = new Float32Array(COUNT * 3);
        const sizes = new Float32Array(COUNT);

        const colorA = new THREE.Color(0x4facfe); // голубой
        const colorB = new THREE.Color(0xa18cd1); // фиолетовый
        const colorC = new THREE.Color(0xf5576c); // розовый
        const colorD = new THREE.Color(0xfee140); // золотой

        for (let i = 0; i < COUNT; i++) {
            const t = i / COUNT; // 0..1
            const angle = t * REVOLUTIONS * Math.PI * 2;
            const radius = 0.4 + t * RADIUS_MAX;
            const y = -HEIGHT_MAX + t * HEIGHT_MAX * 2;

            // Позиция
            positions[i * 3] = radius * Math.cos(angle);
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = radius * Math.sin(angle);

            // Цвет — плавный градиент
            let mixColor;
            if (t < 0.33) {
                const p = t / 0.33;
                mixColor = colorA.clone().lerp(colorB, p);
            } else if (t < 0.66) {
                const p = (t - 0.33) / 0.33;
                mixColor = colorB.clone().lerp(colorC, p);
            } else {
                const p = (t - 0.66) / 0.34;
                mixColor = colorC.clone().lerp(colorD, p);
            }

            // Добавляем немного случайного разброса для живости
            const hueShift = (Math.random() - 0.5) * 0.04;
            mixColor.offsetHSL(hueShift, 0.0, 0.0);

            colors[i * 3] = mixColor.r;
            colors[i * 3 + 1] = mixColor.g;
            colors[i * 3 + 2] = mixColor.b;

            // Размер — увеличивается к краям, с небольшим случайным разбросом
            const baseSize = 0.12 + t * 0.5;
            sizes[i] = baseSize * (0.7 + Math.random() * 0.6);
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const material = new THREE.PointsMaterial({
            size: 0.5,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.92,
            vertexColors: true,
            sizeAttenuation: true,
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // ────────────────────────────
        // 6. ФОНОВЫЕ ЗВЁЗДЫ
        // ────────────────────────────
        function createStars() {
            const starCount = 3000;
            const starPos = new Float32Array(starCount * 3);
            const starSizes = new Float32Array(starCount);
            const starColors = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount; i++) {
                const r = 30 + Math.random() * 70;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                starPos[i * 3 + 1] = r * Math.cos(phi);
                starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

                const brightness = 0.3 + Math.random() * 0.7;
                const tint = Math.random();
                if (tint < 0.33) {
                    starColors[i * 3] = brightness;
                    starColors[i * 3 + 1] = brightness * 0.9;
                    starColors[i * 3 + 2] = brightness;
                } else if (tint < 0.66) {
                    starColors[i * 3] = brightness;
                    starColors[i * 3 + 1] = brightness;
                    starColors[i * 3 + 2] = brightness * 0.85;
                } else {
                    starColors[i * 3] = brightness * 0.9;
                    starColors[i * 3 + 1] = brightness * 0.95;
                    starColors[i * 3 + 2] = brightness;
                }

                starSizes[i] = 0.05 + Math.random() * 0.2;
            }

            const starGeo = new THREE.BufferGeometry();
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
            starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

            const starMat = new THREE.PointsMaterial({
                size: 0.3,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.6,
                vertexColors: true,
                sizeAttenuation: true,
            });

            return new THREE.Points(starGeo, starMat);
        }

        const stars = createStars();
        scene.add(stars);

        // ────────────────────────────
        // 7. СЧЁТЧИК
        // ────────────────────────────
        document.getElementById('countDisplay').textContent = COUNT.toLocaleString();

        // ────────────────────────────
        // 8. АНИМАЦИЯ
        // ────────────────────────────
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsed = performance.now() * 0.0003;

            // Лёгкое пульсирование размера частиц
            const pulse = 1 + Math.sin(elapsed * 0.6) * 0.04;
            material.size = 0.5 * pulse;

            // Медленное вращение звёзд
            stars.rotation.y += delta * 0.008;
            stars.rotation.x += delta * 0.003;

            // Обновление контролов
            controls.update();

            // Рендеринг через композер
            composer.render();

            requestAnimationFrame(animate);
        }

        animate();

        // ────────────────────────────
        // 9. АДАПТИВ
        // ────────────────────────────
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;

            camera.aspect = w / h;
            camera.updateProjectionMatrix();

            renderer.setSize(w, h);
            composer.setSize(w, h);
        });

        // ────────────────────────────
        // 10. КЛАВИША R — СБРОС
        // ────────────────────────────
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                camera.position.set(14, 8, 18);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        });

        // ────────────────────────────
        // 11. ПОДСКАЗКА ПРИ ЗАГРУЗКЕ
        // ────────────────────────────
        console.log(`✨ Спираль из ${COUNT} частиц загружена!`);
        console.log('🔄 Перетащите для вращения · Scroll для масштаба · R для сброса');
    </script>
</body>
</html>
